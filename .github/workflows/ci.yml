name: MATLAB Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run MATLAB tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # MATLAB Coder is a transformation product, so the automatic licensing
      # that setup-matlab provides for public repositories does not cover it.
      # A MATLAB batch licensing token is required (stored as the
      # MLM_LICENSE_TOKEN repository secret).
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: MATLAB_Coder

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        env:
          MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
        with:
          source-folder: src
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
